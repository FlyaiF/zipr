[package]
name = "zipr"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[lib]
name = "zipr_lib"
path = "src/lib.rs"

[[bin]]
name = "zipr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
fs2 = "0.4.3"
glob = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.14"
thiserror = "2.0.21"
time = { version = "0.3", features = ["local-offset"] }
toml = "1.1"
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
assert_cmd = "2.0"
filetime = "0.2"
wait-timeout = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
xattr = "1.7.0"
