[package]
name = "zipr"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "zipr_lib"
path = "src/lib.rs"

[[bin]]
name = "zipr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.14"
time = "0.3"
toml = "0.8"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
assert_cmd = "2.0"
filetime = "0.2"
wait-timeout = "0.2"
